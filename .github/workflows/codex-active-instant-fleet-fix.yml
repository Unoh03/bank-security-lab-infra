name: Codex active instant Fleet fix

on:
  push:
    branches:
      - codex/active-instant-fleet-residue-fix-20260806

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        shell: pwsh
        run: .\tools\run-active-instant-fleet-fix.ps1

      - name: Run Fleet residue contracts
        shell: pwsh
        run: .\tests\test-fleet-residue.ps1

      - name: Run Karpenter cleanup contracts
        shell: pwsh
        run: .\tests\test-karpenter-cleanup.ps1

      - name: Verify diff scope
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $expected = @('daily-common.ps1', 'tests/test-fleet-residue.ps1')
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected changed files: $($unexpected -join ', ')"
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) {
              throw "Expected file was not changed: $path"
            }
          }
          git diff --check

      - name: Commit validated patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-common.ps1 tests/test-fleet-residue.ps1
          git rm -f .github/workflows/codex-active-instant-fleet-fix.yml tools/apply-active-instant-fleet-fix.ps1 tools/run-active-instant-fleet-fix.ps1
          git commit -m "Handle active instant EC2 Fleet residue"
          git push origin HEAD:${{ github.ref_name }}
