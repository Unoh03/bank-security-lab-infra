name: Codex active instant Fleet format cleanup

on:
  push:
    branches:
      - codex/active-instant-fleet-residue-fix-20260806

permissions:
  contents: write

jobs:
  format-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean focused formatting
        shell: pwsh
        run: .\tools\cleanup-active-instant-fleet-format.ps1

      - name: Run Fleet residue contracts
        shell: pwsh
        run: .\tests\test-fleet-residue.ps1

      - name: Run Karpenter cleanup contracts
        shell: pwsh
        run: .\tests\test-karpenter-cleanup.ps1

      - name: Verify diff scope
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $expected = @('daily-common.ps1', 'tests/test-fleet-residue.ps1')
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected changed files: $($unexpected -join ', ')"
          }
          git diff --check

      - name: Commit cleaned validated tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-common.ps1 tests/test-fleet-residue.ps1
          git rm -f .github/workflows/codex-active-instant-fleet-format.yml tools/cleanup-active-instant-fleet-format.ps1
          git commit -m "Clean active instant Fleet residue fix"
          git push origin HEAD:${{ github.ref_name }}
