name: Apply Karpenter tag contract fix

on:
  push:
    branches:
      - codex/karpenter-tag-contract-fix-20260806

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Karpenter tag contract patch
        run: python automation/apply-karpenter-tag-contract-fix.py

      - name: Validate shell template syntax
        run: bash -n templates/install-cluster-addons.sh.tpl

      - name: Run Karpenter cleanup contracts
        shell: pwsh
        run: ./tests/test-karpenter-cleanup.ps1

      - name: Run Fleet residue regression contracts
        shell: pwsh
        run: ./tests/test-fleet-residue.ps1

      - name: Commit generated fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-karpenter-tag-contract-fix.yml automation/apply-karpenter-tag-contract-fix.py
          git add templates/install-cluster-addons.sh.tpl automation/Karpenter.Cleanup.psm1 tests/test-karpenter-cleanup.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align Karpenter tag and cleanup contracts"
          git push origin HEAD:codex/karpenter-tag-contract-fix-20260806
