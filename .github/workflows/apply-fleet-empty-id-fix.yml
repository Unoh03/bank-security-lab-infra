name: Apply Fleet empty ID fix

on:
  push:
    branches:
      - codex/fleet-empty-id-fix-runner

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Fleet empty-ID patch
        run: python automation/apply-fleet-empty-id-fix.py
      - name: Run Fleet residue tests
        shell: pwsh
        run: ./tests/test-fleet-residue.ps1
      - name: Commit generated fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-fleet-empty-id-fix.yml automation/apply-fleet-empty-id-fix.py
          git add daily-common.ps1 tests/test-fleet-residue.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ignore blank EC2 Fleet instance IDs"
          git push origin HEAD:codex/fleet-empty-id-fix-runner
