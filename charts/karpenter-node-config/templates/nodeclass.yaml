apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: {{ .Values.nodeRole | quote }}
  metadataOptions:
    httpEndpoint: {{ .Values.metadataOptions.httpEndpoint | quote }}
    httpProtocolIPv6: {{ .Values.metadataOptions.httpProtocolIPv6 | quote }}
    httpPutResponseHopLimit: {{ .Values.metadataOptions.httpPutResponseHopLimit }}
    httpTokens: {{ .Values.metadataOptions.httpTokens | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  tags:
    Project: {{ .Values.projectName | quote }}
    ManagedBy: "Karpenter"
